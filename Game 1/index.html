<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0620">
  <title>JoJo Catcher — Stand Overdrive</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23241050'/%3E%3Cpath d='M32 8l6.5 15.5L55 25l-12.5 11L46 52 32 43.5 18 52l3.5-16L9 25l16.5-1.5z' fill='%23ffd25e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="stylesheet.css?v=2.0">
  <!-- p5.js staat lokaal in vendor/, dus de game werkt ook zonder internet -->
  <script src="vendor/p5.min.js"></script>
  <!-- Volgorde is belangrijk: eerst de instellingen, als laatste sketch.js.
       "?v=2.0" zorgt dat browsers na een update de nieuwe code laden: verhoog dit nummer bij een nieuwe versie. -->
  <script src="src/config.js?v=2.0"></script>
  <script src="src/utils.js?v=2.0"></script>
  <script src="src/storage.js?v=2.0"></script>
  <script src="src/ui.js?v=2.0"></script>
  <script src="src/view.js?v=2.0"></script>
  <script src="src/input.js?v=2.0"></script>
  <script src="src/audio.js?v=2.0"></script>
  <script src="src/assets.js?v=2.0"></script>
  <script src="src/effects.js?v=2.0"></script>
  <script src="src/background.js?v=2.0"></script>
  <script src="src/catcher.js?v=2.0"></script>
  <script src="src/objects.js?v=2.0"></script>
  <script src="src/waves.js?v=2.0"></script>
  <script src="src/cinematics.js?v=2.0"></script>
  <script src="src/stands.js?v=2.0"></script>
  <script src="src/cards.js?v=2.0"></script>
  <script src="src/boss.js?v=2.0"></script>
  <script src="src/hud.js?v=2.0"></script>
  <script src="src/screens.js?v=2.0"></script>
  <script src="src/settings.js?v=2.0"></script>
  <script src="src/game.js?v=2.0"></script>
  <script src="src/sketch.js?v=2.0"></script>
</head>
<body>
  <div id="settings" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <section class="panel">
      <h1 id="settings-title">INSTELLINGEN</h1>

      <h2>Geluid</h2>
      <label class="row toggle"><span>Geluid uit (sneltoets M)</span><input type="checkbox" data-setting="muted"></label>
      <label class="row"><span>Hoofdvolume</span><input type="range" data-setting="master" min="0" max="1" step="0.05"></label>
      <label class="row"><span>Muziek</span><input type="range" data-setting="music" min="0" max="1" step="0.05"></label>
      <label class="row"><span>Stemmen</span><input type="range" data-setting="voice" min="0" max="1" step="0.05"></label>
      <label class="row"><span>Effecten</span><input type="range" data-setting="sfx" min="0" max="1" step="0.05"></label>
      <label class="row"><span>Soundtrack</span>
        <select data-setting="soundtrack">
          <option value="giorno">Giorno's Theme</option>
          <option value="kira">Kira's Theme</option>
          <option value="classic">Originele beat</option>
        </select>
      </label>
      <label class="row"><span>Stem bij ZA WARUDO</span>
        <select data-setting="timeStopVoice">
          <option value="dio">DIO · The World</option>
          <option value="jotaro">Jotaro · Star Platinum</option>
        </select>
      </label>

      <h2>Beeld</h2>
      <label class="row toggle"><span>Scherm schudden</span><input type="checkbox" data-setting="shake"></label>
      <label class="row toggle"><span>Felle flitsen (uit = rustiger voor je ogen)</span><input type="checkbox" data-setting="flashes"></label>
      <label class="row toggle"><span>Veel deeltjes</span><input type="checkbox" data-setting="particles"></label>
      <label class="row toggle"><span>FPS tonen</span><input type="checkbox" data-setting="showFps"></label>

      <div class="buttons">
        <button id="settings-close" class="primary" type="button">TERUG</button>
        <button id="settings-reset" type="button">RECORD WISSEN</button>
      </div>
      <p class="note">Je instellingen en je record worden bewaard in deze browser. ESC sluit dit venster.</p>
    </section>
  </div>

  <div id="load-error" hidden role="alert">
    <strong>De game kon niet starten.</strong>
    <p>p5.js is niet geladen. Open de map <code>Game 1</code> met Live Server in VS Code en probeer het opnieuw.</p>
  </div>
  <script>
    window.addEventListener('load', () => {
      if (typeof window.p5 === 'undefined') document.getElementById('load-error').hidden = false;
    });
  </script>
</body>
</html>
